# UrbanLens — frozen pipeline parameters. Values here are treated as fitted
# config, not something to tune per-run: notably band mean/std, computed once
# from training cities only (see project instructions section 5) and loaded
# unchanged at both training and inference time.

seed: 42

patch:
  size: 256
  min_spacing_px: 128        # min distance between sampled patch centers
  invalid_pixel_frac_max: 0.10   # reject a candidate patch above this
  budget_per_train_city: 2000    # divided across that city's available dates
  holdout_strip_frac: 0.20   # eastern strip of each train city, reserved for val

bands:
  order: [B02_blue, B03_green, B04_red, B08_nir, B11_swir]
  # filled in by `python src/dataset.py --compute-stats`, training cities only
  # (Bengaluru, Chennai, Pune, Coimbatore, Vizag — full-raster scan of the
  # re-exported S2_SR_HARMONIZED rasters, 2026-10-08). Previous values, from
  # the old 4-city set: mean [799.79, 1029.99, 1215.53, 2088.49, 2417.66].
  mean: [725.79, 922.97, 1065.27, 1980.29, 2186.3]
  std: [337.55, 422.14, 589.02, 922.62, 1119.42]

classes:
  # target class order = model output channel order (section 4)
  names: [Urban, Vegetation, Water, Agriculture, Bare Soil]
  ignore_index: 255
  # Dynamic World class ID -> target class ID. DW 8 (Snow/ice) has no target
  # class and maps straight to ignore_index.
  dw_to_target:
    0: 2   # Water -> Water
    1: 1   # Trees -> Vegetation
    2: 1   # Grass -> Vegetation
    3: 1   # Flooded vegetation -> Vegetation
    4: 3   # Crops -> Agriculture
    5: 1   # Shrub and scrub -> Vegetation
    6: 0   # Built -> Urban
    7: 4   # Bare ground -> Bare Soil

cities:
  # mumbai dropped (2026-09-26) after its unresolved Agriculture IoU; ahmedabad
  # dropped and kochi + vizag added (2026-10-06); then hyderabad moved to
  # held-out and coimbatore + vizag moved to training (2026-10-06).
  train: [bengaluru, chennai, pune, coimbatore, vizag]
  test: [hyderabad, kochi]
